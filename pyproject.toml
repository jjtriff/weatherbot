[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherbot"
version = "3.0.0a1"
description = "Paper-first weather market trading research bot"
requires-python = ">=3.10"
dependencies = [
  "polymarket-us",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
weatherbot = "weatherbot.cli:main"

[tool.setuptools.packages.find]
include = ["weatherbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["weatherbot"]
